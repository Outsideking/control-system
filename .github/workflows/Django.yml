name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Check Outsideking Control System
        run: |
          echo "Checking controller.py..."
          python -c "import controller; print('Controller OK'); print(controller.status())"
          echo "Checking Flask..."
          python -c "from flask import Flask; app = Flask(__name__); print('Flask App OK')"
          echo "Checking main system..."
          python -c "print('Outsideking Control System - Build Success')"
          
      - name: Build Success
        run: echo "✅ All checks passed - System ONLINE"