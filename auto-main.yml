name: Auto Fix Main
on: [push]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto create main.py
        run: |
          cat > main.py << 'PY'
          # main.py - Auto Generated by Outsideking System
          from flask import Flask, jsonify
          from datetime import datetime
          import os
          
          app = Flask(__name__)
          
          @app.route("/")
          def home():
              return jsonify({
                  "system": "Outsideking Control System",
                  "status": "ONLINE - AUTO FIXED",
                  "branch": "main",
                  "time": datetime.now().isoformat(),
                  "url": "https://control-system-peach.vercel.app",
                  "auto": True
              })
          
          @app.route("/health")
          def health():
              return jsonify({"ok": True, "main": "fixed"})
          
          # สำหรับ Vercel
          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=int(os.environ.get("PORT", 5000)))
          PY
          
          cat > requirements.txt << 'REQ'
          Flask==3.0.0
          REQ
          
          cat > vercel.json << 'JSON'
          {
            "version": 2,
            "builds": [{"src": "main.py", "use": "@vercel/python"}],
            "routes": [{"src": "/(.*)", "dest": "main.py"}]
          }
          JSON
          
          git config --global user.name "Outsideking-Bot"
          git config --global user.email "bot@outsideking.com"
          git add main.py requirements.txt vercel.json
          git diff --staged --quiet || git commit -m "Auto fix main.py [bot]"
          git push